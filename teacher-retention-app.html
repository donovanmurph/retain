<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
/* Matches the Retain website: DM Sans, pill controls, soft panels.
   Each section has its own color so you always know where you are:
   Flags = amber, Current teachers = blue, Prospective hires = violet,
   Openings = teal, District files = slate. */
:root {
  --bg: #ffffff; --tint: #f0f4f9; --tint-2: #e8eef7; --surface: #ffffff;
  --ink: #1f1f1f; --muted: #5f6368; --line: #e3e7ee;
  --accent: #0b57d0; --accent-soft: #d3e3fd; --accent-ink: #041e49; --on-accent: #ffffff;
  --warn: #f9ab00; --warn-soft: #feefc3; --warn-ink: #5c3c00;
  --green: #146c2e; --green-soft: #c4eed0; --red: #b3261e;
  --c-flags: #b26a00; --c-flags-soft: #feefc3; --c-flags-ink: #5c3c00;
  --c-teach: #0b57d0; --c-teach-soft: #d3e3fd; --c-teach-ink: #041e49;
  --c-cand:  #8430ce; --c-cand-soft:  #f0e2fd; --c-cand-ink:  #3a0b66;
  --c-open:  #00796b; --c-open-soft:  #c9efe8; --c-open-ink:  #00332c;
  --c-files: #5f6368; --c-files-soft: #e8eaed; --c-files-ink: #202124;
  --s: var(--c-teach); --s-soft: var(--c-teach-soft); --s-ink: var(--c-teach-ink);
  --font: "DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131314; --tint: #1e1f20; --tint-2: #282a2c; --surface: #1b1c1d;
    --ink: #e3e3e3; --muted: #a8abb0; --line: #2f3133;
    --accent: #a8c7fa; --accent-soft: #0842a0; --accent-ink: #d3e3fd; --on-accent: #062e6f;
    --warn: #fdd663; --warn-soft: #3d3000; --warn-ink: #feefc3;
    --green: #81c995; --green-soft: #0f3d1f; --red: #f2b8b5;
    --c-flags: #fdd663; --c-flags-soft: #3d3000; --c-flags-ink: #feefc3;
    --c-teach: #a8c7fa; --c-teach-soft: #0842a0; --c-teach-ink: #d3e3fd;
    --c-cand:  #d7aefb; --c-cand-soft:  #4b1a78; --c-cand-ink:  #f3e6ff;
    --c-open:  #6fdbc8; --c-open-soft:  #004a40; --c-open-ink:  #c9efe8;
    --c-files: #bdc1c6; --c-files-soft: #303134; --c-files-ink: #e8eaed;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131314; --tint: #1e1f20; --tint-2: #282a2c; --surface: #1b1c1d;
  --ink: #e3e3e3; --muted: #a8abb0; --line: #2f3133;
  --accent: #a8c7fa; --accent-soft: #0842a0; --accent-ink: #d3e3fd; --on-accent: #062e6f;
  --warn: #fdd663; --warn-soft: #3d3000; --warn-ink: #feefc3;
  --green: #81c995; --green-soft: #0f3d1f; --red: #f2b8b5;
  --c-flags: #fdd663; --c-flags-soft: #3d3000; --c-flags-ink: #feefc3;
  --c-teach: #a8c7fa; --c-teach-soft: #0842a0; --c-teach-ink: #d3e3fd;
  --c-cand:  #d7aefb; --c-cand-soft:  #4b1a78; --c-cand-ink:  #f3e6ff;
  --c-open:  #6fdbc8; --c-open-soft:  #004a40; --c-open-ink:  #c9efe8;
  --c-files: #bdc1c6; --c-files-soft: #303134; --c-files-ink: #e8eaed;
  color-scheme: dark;
}
[data-c="flags"] { --s: var(--c-flags); --s-soft: var(--c-flags-soft); --s-ink: var(--c-flags-ink); }
[data-c="teach"] { --s: var(--c-teach); --s-soft: var(--c-teach-soft); --s-ink: var(--c-teach-ink); }
[data-c="cand"]  { --s: var(--c-cand);  --s-soft: var(--c-cand-soft);  --s-ink: var(--c-cand-ink); }
[data-c="open"]  { --s: var(--c-open);  --s-soft: var(--c-open-soft);  --s-ink: var(--c-open-ink); }
[data-c="files"] { --s: var(--c-files); --s-soft: var(--c-files-soft); --s-ink: var(--c-files-ink); }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16.5px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; }
input, select, textarea { font: inherit; color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Layout: sidebar + page */
.shell { display: grid; grid-template-columns: 256px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 22px 14px 18px; background: var(--tint); border-right: 1px solid var(--line); overflow-y: auto; z-index: 5; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 18px; }
.mark { width: 30px; height: 30px; flex: none; }
.site-name { font-size: 21px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.2; }
.site-name small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 400; letter-spacing: 0; margin-top: 2px; }
.banner { display: inline-block; color: var(--warn-ink); background: var(--warn-soft); padding: 3px 10px; border-radius: 12px; font-weight: 500; font-size: 12.5px; line-height: 1.4; }
.banner.bm { display: none; }
.navlist { display: flex; flex-direction: column; gap: 3px; }
.ngl { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 12px 4px; }
.ngl:first-child { margin-top: 0; }
.nav { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 14px; font-weight: 500; font-size: 15px; white-space: nowrap; text-align: left; transition: background .15s, box-shadow .15s; }
.nav:hover { background: color-mix(in srgb, var(--surface) 70%, transparent); }
.nico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--s-soft); color: var(--s-ink); flex: none; transition: background .15s, color .15s; }
.nico .ic { width: 18px; height: 18px; }
.nav .nl { flex: 1; }
.nav.on { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.08), inset 4px 0 0 var(--s); }
.nav.on .nico { background: var(--s); color: var(--bg); }
.count { min-width: 24px; height: 22px; border-radius: 999px; padding: 0 7px; font-size: 12px; font-weight: 600; line-height: 22px; text-align: center; background: var(--tint-2); color: var(--ink); }
.nav.on .count { background: var(--s-soft); color: var(--s-ink); }
.count.gold, .nav.on .count.gold { background: var(--warn); color: #3a2600; }
.sidefoot { margin-top: auto; padding: 18px 10px 0; font-size: 12.5px; color: var(--muted); }
.sidefoot p { margin: 8px 0 0; }

.page { min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
main { flex: 1; }
main:focus { outline: none; }
footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; margin-top: 16px; }
footer .wrap { padding-block: 22px; }

/* Section header card */
.hero .wrap { padding-top: 28px; }
.herocard { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; padding: 30px 34px; border-radius: 28px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--s-soft) 90%, var(--bg)), color-mix(in srgb, var(--s-soft) 30%, var(--bg)));
  border: 1px solid color-mix(in srgb, var(--s) 22%, transparent); }
.hico { width: 64px; height: 64px; border-radius: 20px; background: var(--s); color: var(--bg); display: grid; place-items: center; flex: none; }
.hico .ic { width: 30px; height: 30px; }
.herocard .who { flex: 1 1 260px; min-width: 0; }
h1, h2 { font-weight: 500; letter-spacing: -0.025em; text-wrap: balance; margin: 0; color: var(--ink); line-height: 1.12; }
h1 { font-size: clamp(30px, 4vw, 44px); }
.subhead { margin: 8px 0 0; max-width: 64ch; color: var(--muted); font-size: 17px; }
.eyebrow { font-size: 14px; font-weight: 600; color: var(--s); margin: 0 0 6px; letter-spacing: .01em; }
.herocard .eyebrow { color: var(--s-ink); opacity: .85; }
.label { font-size: 13px; font-weight: 500; color: var(--muted); margin: 0 0 6px; }
h2.sec { font-size: 22px; display: block; margin-bottom: 16px; }
.content { padding-block: 26px 72px; }
.spaced { margin-top: 48px; }
.muted { color: var(--muted); font-weight: 400; }

/* Controls */
.tools { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; margin-bottom: 20px; }
.search { flex: 1 1 240px; max-width: 380px; padding: 11px 18px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.select { padding: 11px 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.search:focus, .select:focus { outline: 2px solid var(--s); outline-offset: -1px; border-color: transparent; }
.selwrap { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.selwrap .label { margin: 0; }
.seg { display: inline-flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--tint); }
.seg button { padding: 8px 16px; border-radius: 999px; font-weight: 500; font-size: 15px; color: var(--muted); white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg.small button { padding: 5px 12px; font-size: 13.5px; }
.btn { display: inline-flex; align-items: center; justify-content: center; background: var(--s); color: var(--bg); font-weight: 500; font-size: 15px; padding: 12px 22px; border-radius: 999px; transition: box-shadow .2s, filter .2s; }
.btn:hover { filter: brightness(1.06); box-shadow: 0 2px 8px -2px color-mix(in srgb, var(--s) 60%, transparent); }
.btn.ghost { background: transparent; color: var(--s); box-shadow: inset 0 0 0 1px var(--line); }
.btn.ghost:hover { background: var(--tint); filter: none; }
.linkish { color: var(--accent); font-weight: 500; }
.linkish:hover { text-decoration: underline; text-underline-offset: 3px; }
.err { color: var(--red); font-weight: 500; font-size: 14.5px; margin: 8px 0 0; }

/* Status tiles (Flags page) */
.stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stat { display: flex; align-items: baseline; gap: 10px; min-width: 150px; padding: 12px 18px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); text-align: left; transition: background .15s, border-color .15s; }
.stat b { font-size: 28px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-weight: 500; color: var(--muted); }
.stat:hover { border-color: var(--t); }
.stat[data-tone="open"] { --t: var(--warn); --ts: var(--warn-soft); --ti: var(--warn-ink); }
.stat[data-tone="progress"] { --t: var(--accent); --ts: var(--accent-soft); --ti: var(--accent-ink); }
.stat[data-tone="resolved"] { --t: var(--green); --ts: var(--green-soft); --ti: var(--green); }
.stat[aria-pressed="true"] { background: var(--ts); border-color: var(--t); box-shadow: inset 0 0 0 1px var(--t); }
.stat[aria-pressed="true"] span, .stat[aria-pressed="true"] b { color: var(--ti); }

/* Filter chips (lists) */
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 22px; padding: 14px 16px; border-radius: 20px; background: var(--tint); }
.chips .label { margin: 0 6px 0 2px; font-weight: 600; color: var(--ink); }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 500; font-size: 14px; white-space: nowrap; transition: background .15s, border-color .15s; }
.chip .ic { width: 15px; height: 15px; color: var(--c-flags); }
.chip .cc { font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip:hover:not(:disabled) { border-color: var(--s); }
.chip[aria-pressed="true"] { background: var(--s); border-color: var(--s); color: var(--bg); }
.chip[aria-pressed="true"] .ic, .chip[aria-pressed="true"] .cc { color: var(--bg); }
.chip:disabled { opacity: .45; }

/* Tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 24px; }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-size: 13px; font-weight: 600; color: var(--s-ink); padding: 14px 18px; background: color-mix(in srgb, var(--s-soft) 55%, var(--bg)); white-space: nowrap; }
td { padding: 14px 18px; border-top: 1px solid var(--line); vertical-align: middle; }
tbody tr[data-id] { cursor: pointer; }
tbody tr[data-id]:hover td { background: var(--tint); }
tbody tr.flagged td:first-child { box-shadow: inset 4px 0 0 var(--warn); }
td.nm { font-weight: 500; white-space: nowrap; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.ok { color: var(--muted); }
.missing { color: var(--red); font-weight: 500; font-size: 14px; }
.flag { display: inline-flex; align-items: center; gap: 5px; background: var(--warn-soft); color: var(--warn-ink); font-weight: 500; font-size: 12.5px; line-height: 1.4; padding: 4px 11px 4px 9px; border-radius: 999px; white-space: nowrap; margin: 2px 4px 2px 0; }
.flag .ic { width: 14px; height: 14px; }
.flag.prog { background: transparent; box-shadow: inset 0 0 0 1px var(--warn); }
.empty { color: var(--muted); padding: 24px 18px; }
.kdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--s); margin-right: 7px; vertical-align: 1px; }

/* Flags page */
.flagsgrid { display: grid; grid-template-columns: minmax(250px, 320px) minmax(0, 1fr); gap: 24px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 22px; }
.filterpanel { position: sticky; top: 20px; }
.phd { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.panel .ngl { margin: 16px 8px 4px; }
.rrow { display: flex; width: 100%; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 14px; text-align: left; transition: background .15s; }
.rrow:hover:not(:disabled) { background: var(--tint); }
.rrow:disabled { opacity: .45; }
.rrow.on { background: var(--c-flags-soft); box-shadow: inset 0 0 0 1px var(--c-flags); }
.rico { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--warn-soft); color: var(--warn-ink); flex: none; }
.rico .ic { width: 17px; height: 17px; }
.rrow.on .rico { background: var(--c-flags); color: var(--bg); }
.rl { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.rn { font-weight: 500; font-size: 15px; line-height: 1.25; }
.bt { height: 5px; background: var(--tint-2); border-radius: 999px; overflow: hidden; }
.bf { display: block; height: 100%; background: var(--warn); border-radius: 999px; }
.rc { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 20px; text-align: right; }
.hl { color: var(--c-flags); }
.orow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; width: 100%; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 16px; text-align: left; transition: background .15s; }
.orow + .orow { border-top: 1px solid var(--line); }
.orow:hover { background: var(--tint); }
.orow .n { font-weight: 500; }
.orow .n small { display: block; font-weight: 400; color: var(--muted); font-size: 14px; }
.reason { font-weight: 500; font-size: 12.5px; color: var(--warn-ink); background: var(--warn-soft); padding: 4px 11px; border-radius: 14px; white-space: nowrap; text-align: right; }
.reason small { display: block; font-weight: 400; opacity: .8; font-size: 12px; }
.reason.prog { background: var(--accent-soft); color: var(--accent-ink); }
.reason.done { background: var(--green-soft); color: var(--green); }
.rico.done { background: var(--green-soft); color: var(--green); }
.rico.prog { background: var(--accent-soft); color: var(--accent-ink); }
.note { margin-top: 20px; padding: 16px 20px; background: var(--tint); border-radius: 20px; }
.note b { font-weight: 600; }
.clearbtn { margin-top: 8px; }

/* Person page */
.back { color: var(--muted); font-weight: 500; margin: 0 0 12px -14px; padding: 8px 14px; border-radius: 999px; display: inline-flex; gap: 8px; }
.back:hover { background: var(--tint); color: var(--ink); }
.av { width: 76px; height: 76px; border-radius: 50%; background: var(--s); color: var(--bg); font-weight: 600; font-size: 26px; line-height: 76px; text-align: center; flex: none; }
.pbadge { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.clear { display: inline-block; color: var(--muted); font-weight: 500; font-size: 13px; box-shadow: inset 0 0 0 1px var(--line); padding: 4px 12px; border-radius: 999px; background: var(--surface); }
.clear.done { color: var(--green); background: var(--green-soft); box-shadow: none; }
.pbody { max-width: 880px; }
.fblock { margin-bottom: 20px; border: 1px solid var(--line); border-left: 6px solid var(--warn); border-radius: 24px; padding: 24px 28px; }
.fblock.progress { border-left-color: var(--accent); }
.fblock.resolved { border-left-color: var(--green); }
.fblock.plain { border-left-width: 1px; }
.fhead { display: flex; justify-content: space-between; align-items: center; gap: 12px 20px; flex-wrap: wrap; }
.ftitle { display: flex; align-items: center; gap: 14px; }
.fblock h2 { font-size: 23px; }
.fblock .eyebrow { font-size: 12.5px; margin-bottom: 2px; color: var(--muted); }
.when { color: var(--muted); font-size: 15px; margin: 10px 0 0; }
.why { list-style: none; margin: 12px 0 0; padding: 0; }
.why li { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 12px 2px; border-bottom: 1px solid var(--line); font-weight: 500; }
.why li:last-child { border-bottom: 0; }
.src { font-size: 12.5px; font-weight: 400; color: var(--muted); white-space: nowrap; text-align: right; }
.src.you { color: var(--accent); font-weight: 500; }
.step { margin-top: 14px; background: var(--accent-soft); color: var(--accent-ink); border-radius: 20px; padding: 16px 20px; }
.step .label { margin-bottom: 2px; color: inherit; opacity: .8; }
.step p:not(.label) { margin: 0; font-size: 17px; font-weight: 500; line-height: 1.5; }
.fblock.resolved .why, .fblock.resolved .step { opacity: .6; }
.fblock.resolved .step { background: var(--green-soft); color: var(--green); }
.notes { margin-top: 16px; }
.notes label { display: block; font-weight: 500; color: var(--muted); font-size: 14px; margin-bottom: 6px; }
.notes textarea { width: 100%; min-height: 72px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--bg); resize: vertical; font-size: 15.5px; }
.notes textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.notes small { color: var(--muted); }
.ask { background: color-mix(in srgb, var(--warn-soft) 45%, var(--bg)); border: 1px dashed var(--warn); border-radius: 24px; padding: 24px 28px; margin-bottom: 20px; }
.ask p { margin: 0 0 6px; }
.ask .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 16px; margin: 16px 0; }
.ask .fields label { display: flex; flex-direction: column; gap: 4px; font-weight: 500; font-size: 15px; }
.ask .fields small { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.ask input, .ask select { padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.ask input:focus, .ask select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
dl.file { display: grid; grid-template-columns: minmax(150px, max-content) minmax(0, 1fr) auto; margin: 0; border: 1px solid var(--line); border-radius: 24px; padding: 6px 24px; }
dl.file > div { display: contents; }
dl.file dt, dl.file dd { margin: 0; padding: 11px 0; border-bottom: 1px solid var(--line); }
dl.file > div:last-child dt, dl.file > div:last-child dd { border-bottom: 0; }
dl.file dt { color: var(--muted); padding-right: 20px; }
dl.file dd { font-weight: 500; }
dl.file dd.none { color: var(--muted); font-weight: 400; }
dl.file dd.gone { color: var(--red); }
dl.file dd.src { padding-left: 16px; display: flex; align-items: center; justify-content: flex-end; }

/* Openings */
.ocards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.ocard { background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--s); border-radius: 24px; padding: 20px 22px; }
.ocard.cold { border-top-color: var(--warn); }
.ohead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.ocard h2 { font-size: 20px; line-height: 1.3; }
.days { font-weight: 600; color: var(--s-ink); background: var(--s-soft); padding: 2px 10px; border-radius: 999px; white-space: nowrap; font-size: 13px; }
.meta { color: var(--muted); font-size: 14.5px; margin: 6px 0 12px; }
.clist { list-style: none; margin: 0; padding: 4px 14px; background: var(--tint); border-radius: 16px; }
.clist li + li { border-top: 1px solid var(--line); }
.clist button { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; text-align: left; }
.clist button:hover .cn { color: var(--c-cand); }
.cn { font-weight: 500; }
.cn small { display: block; color: var(--muted); font-weight: 400; font-size: 14px; }
.nocand { margin: 0; padding: 10px 14px; background: var(--warn-soft); color: var(--warn-ink); border-radius: 14px; font-weight: 500; }
.possible { border: 1px solid var(--line); border-radius: 24px; padding: 8px; }

/* District files */
.filerow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center; padding: 22px 0; border-bottom: 1px solid var(--line); }
.filerow .fico { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: var(--fs, var(--s-soft)); color: var(--fi, var(--s-ink)); }
.filerow h2 { font-size: 20px; }
.filerow p { margin: 2px 0 0; color: var(--muted); }
.filerow p b { color: var(--ink); font-weight: 500; }
.filerow .acts { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.filerow input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
.filerow label.btn { cursor: pointer; }
.filerow input[type=file]:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 3px; }
.result { margin-top: 24px; padding: 16px 20px; background: var(--green-soft); border-radius: 20px; }
.result.warn { background: var(--warn-soft); color: var(--warn-ink); }
.result ul { margin: 8px 0 0; padding-left: 20px; }
.howto { max-width: 70ch; }
.howto ul { margin: 0; padding-left: 20px; }
.howto li { margin-bottom: 8px; }
.howto code { background: var(--tint); padding: 2px 8px; border-radius: 6px; font-size: .9em; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 960px) {
  .flagsgrid { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .filterpanel { position: static; }
}
@media (max-width: 900px) {
  .shell { display: block; }
  .side { position: sticky; top: 0; height: auto; padding: 10px 12px 8px; border-right: 0; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--tint) 92%, transparent); backdrop-filter: saturate(1.4) blur(14px); overflow: visible; }
  .brand { padding: 2px 4px 8px; }
  .site-name small { display: none; }
  .banner.bm { display: inline-block; margin-left: auto; }
  .navlist { flex-direction: row; overflow-x: auto; gap: 4px; scrollbar-width: none; }
  .navlist .ngl { display: none; }
  .nav { flex: none; padding: 5px 10px 5px 5px; gap: 8px; font-size: 14px; }
  .nico { width: 28px; height: 28px; border-radius: 8px; }
  .nico .ic { width: 15px; height: 15px; }
  .nav.on { box-shadow: 0 1px 3px rgba(0,0,0,.08), inset 0 -3px 0 var(--s); }
  .sidefoot { display: none; }
  .page { min-height: 0; }
}
@media (max-width: 720px) {
  .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .hero .wrap { padding-top: 16px; }
  .herocard { padding: 22px; gap: 16px; border-radius: 22px; }
  .hico { width: 48px; height: 48px; border-radius: 14px; }
  .hico .ic { width: 24px; height: 24px; }
  .selwrap { margin-left: 0; }
  .stat { min-width: 0; flex: 1 1 0; padding: 10px 12px; flex-direction: column; gap: 4px; }
  .stat b { font-size: 24px; }
  .panel, .fblock { padding: 18px; }
  .av { width: 60px; height: 60px; line-height: 60px; font-size: 21px; }
  dl.file { grid-template-columns: 1fr auto; padding: 6px 18px; }
  dl.file dt { grid-column: 1 / -1; border-bottom: 0; padding-bottom: 0; }
  .why li { flex-direction: column; gap: 2px; }
  .src { text-align: left; }
  .reason { white-space: normal; }
  .orow { grid-template-columns: auto minmax(0, 1fr); }
  .orow .reason { grid-column: 2; justify-self: start; text-align: left; }
  .filerow { grid-template-columns: auto minmax(0, 1fr); }
  .filerow .acts { grid-column: 1 / -1; justify-content: flex-start; }
}

const TODAY = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); })();
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTH = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const ord = n => n + (["th","st","nd","rd"][(n % 100 - 20) % 10] || ["th","st","nd","rd"][n % 100] || "th");
const dateOf = v => { const [y, m, d] = v.split("-").map(Number); return new Date(y, m - 1, d); };
const monthEnd = v => { const [y, m] = v.split("-").map(Number); return new Date(y, m, 0); };
const daysUntil = d => Math.round((d - TODAY) / 864e5);
const fmtDate = v => { const d = dateOf(v); return MON[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(); };
const fmtMonth = v => { const [y, m] = v.split("-").map(Number); return MONTH[m - 1] + " " + y; };
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
const pad2 = n => String(n).padStart(2, "0");

function validate(field, raw) {
  const s = raw == null ? "" : String(raw).trim();
  if (s === "") return { value: undefined };
  let t = field.type;
  if (/OrNone$/.test(t)) {
    if (/^(none|n\/?a)$/i.test(s)) return { value: "none" };
    t = t.replace("OrNone", "");
  }
  if (t === "text") return { value: s };
  if (t === "int") return /^\d+$/.test(s) ? { value: Number(s) } : { error: "should be a whole number" };
  if (t === "month") {
    let m = s.match(/^(\d{4})-(\d{1,2})$/), y, mo;
    if (m) { y = +m[1]; mo = +m[2]; } else if ((m = s.match(/^(\d{1,2})\/(\d{4})$/))) { y = +m[2]; mo = +m[1]; }
    return y && mo >= 1 && mo <= 12 ? { value: y + "-" + pad2(mo) } : { error: "should be a month like 2028-06" };
  }
  if (t === "date") {
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/), y, mo, d;
    if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; } else if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))) { y = +m[3]; mo = +m[1]; d = +m[2]; }
    const dt = y ? new Date(y, mo - 1, d) : null;
    return dt && dt.getMonth() === mo - 1 && dt.getDate() === d ? { value: y + "-" + pad2(mo) + "-" + pad2(d) } : { error: "should be a date like 2027-08-18" };
  }
  if (t === "choice") {
    const hit = field.options.find(o => o.toLowerCase() === s.toLowerCase());
    return hit ? { value: hit } : { error: "should be one of: " + field.options.join(", ") };
  }
  return { value: s };
}

function show(field, v) {
  if (v === undefined) return null;
  if (v === "none") return "None on file";
  const t = field.type.replace("OrNone", "");
  if (t === "month") return fmtMonth(v);
  if (t === "date") return fmtDate(v);
  if (field.k === "year") return ord(v);
  return String(v);
}

/* ==================================================================
   BUILD RECORDS from spreadsheet rows (sample or imported)
================================================================== */
const slug = s => s.toLowerCase().replace(/^(mr|ms|mrs|dr)\.?\s+/, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

function buildRecords(kind, rows, firstRowNumber) {
  const fields = FIELDS[kind].filter(f => !f.derived);
  const keyField = kind === "opening" ? "position" : "name";
  const records = [], errors = [], used = {};
  rows.forEach((raw, i) => {
    const rowNo = firstRowNumber + i;
    if (raw.every(c => c == null || String(c).trim() === "")) return;
    const rec = {};
    fields.forEach((f, j) => {
      const r = validate(f, raw[j]);
      if (r.error) errors.push("Row " + rowNo + ": " + f.label + " “" + String(raw[j]).trim() + "” " + r.error + ". Treated as missing.");
      rec[f.k] = r.error ? undefined : r.value;
    });
    if (!rec[keyField]) { errors.push("Row " + rowNo + ": no " + FIELD[kind][keyField].label.toLowerCase() + ". Row skipped."); return; }
    let id = slug(rec[keyField]) || kind;
    if (used[id]) id += "-" + (++used[id]); else used[id] = 1;
    rec.id = id;
    records.push(rec);
  });
  return { records, errors };
}

function sampleData() {
  return {
    source: "sample",
    teacher: buildRecords("teacher", SAMPLE.teacher, 2).records,
    candidate: buildRecords("candidate", SAMPLE.candidate, 2).records,
    opening: buildRecords("opening", SAMPLE.opening, 2).records,
    imported: {}
  };
}

/* ==================================================================
   STATE: records + your entries + flag statuses -> people and flags
================================================================== */
let DATA = load(KEY.data, null) || sampleData();
let ENTERED = load(KEY.entered, { teacher: {}, candidate: {} });
let STATUS = load(KEY.status, {});
let TEACHERS = [], CANDIDATES = [], OPENINGS = [], PEOPLE = [], FLAGS = [];

function makePerson(kind, rec) {
  const p = Object.assign({}, rec, { kind, src: {}, flags: [], missing: [] });
  if (kind === "candidate") {
    const posting = p.opening ? OPENINGS.find(o => o.position.toLowerCase() === p.opening.toLowerCase()) : null;
    p.posting = posting || null;
    if (posting && posting.start !== undefined) p.openingStart = posting.start;
  }
  const mine = (ENTERED[kind] || {})[rec.id] || {};
  for (const k in mine) { p[k] = mine[k]; p.src[k] = "Entered by you"; }
  RULES[kind].forEach(rule => {
    const lacking = rule.needs(p).filter(k => p[k] === undefined);
    if (lacking.length) { p.missing.push({ rule, fields: lacking }); return; }
    if (!rule.applies(p)) return;
    const key = p.id + ":" + rule.id;
    p.flags.push({ key, rule, person: p, why: rule.why(p).filter(Boolean), step: rule.step(p), status: (STATUS[key] || {}).s || "open" });
  });
  return p;
}

function recompute() {
  OPENINGS = DATA.opening.slice();
  TEACHERS = DATA.teacher.map(r => makePerson("teacher", r));
  CANDIDATES = DATA.candidate.map(r => makePerson("candidate", r));
  PEOPLE = TEACHERS.concat(CANDIDATES);
  FLAGS = PEOPLE.flatMap(p => p.flags);
  const active = FLAGS.filter(f => f.status !== "resolved").length;
  document.getElementById("c-flags").textContent = active;
  document.getElementById("c-teachers").textContent = TEACHERS.length;
  document.getElementById("c-candidates").textContent = CANDIDATES.length;
  document.getElementById("c-openings").textContent = OPENINGS.length;
  const sample = DATA.source === "sample";
  document.getElementById("banner").textContent = sample
    ? "Sample district files · every person shown is made up"
    : "Your district files · stored only in this browser on this computer";
  document.getElementById("banner-m").textContent = sample ? "Sample data" : "Your files";
}

const ic = id => `<svg class="ic" aria-hidden="true"><use href="#${id}"/></svg>`;
const initials = name => name.replace(/^(Mr|Ms|Mrs|Dr)\.?\s+/, "").split(/[\s.]+/).filter(Boolean).map(w => w[0]).join("").slice(0, 2).toUpperCase();
const lastName = n => n.trim().split(/\s+/).pop().toLowerCase();

</div></div></div>`;

function flagChips(p) {
  const act = activeFlags(p);
  if (act.length) return act.map(f => `<span class="flag ${f.status === "progress" ? "prog" : ""}" title="${STATUS_LABEL[f.status]}">${ic(f.rule.icon)}${esc(f.rule.reason)}</span>`).join("");
  if (p.missing.length) return `<span class="missing">Missing information</span>`;
  if (p.flags.length) return `<span class="ok">All flags resolved</span>`;
  return `<span class="ok">No flags</span>`;
}

        ${isT
          ? `<td>${p.subject ? esc(p.subject) : dash}</td><td class="num">${p.year !== undefined ? ord(p.year) : dash}</td>`
          : `<td>${p.opening ? esc(p.opening) : dash}</td><td>${p.stage ? esc(p.stage) : dash}</td><td class="num">${p.lastContact ? esc(fmtDate(p.lastContact)) : dash}</td>`}
        <td>${flagChips(p)}</td>
      </tr>`).join("") : `<tr><td colspan="5" class="empty">No ${isT ? "teachers" : "candidates"} match these filters.</td></tr>`;
    bindPersonLinks(document.getElementById("rows"));
  };
  main.querySelectorAll("[data-lf]").forEach(b => b.addEventListener("click", () => {
    ui.lf = b.dataset.lf === ui.lf ? "" : b.dataset.lf;
    main.querySelectorAll("[data-lf]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.lf === ui.lf)));
    fill();
  }));
  document.getElementById("q").addEventListener("input", e => { ui.q = e.target.value; fill(); });
  if (isT) document.getElementById("dept").addEventListener("change", e => { ui.dept = e.target.value; fill(); });
  fill();
}

/* ==================================================================
   OPENINGS
================================================================== */
function renderOpenings() {
  setNav("openings");
  const stageRank = s => s ? STAGES.indexOf(s) : -1;
  const cards = OPENINGS.map(o => {
    const cands = CANDIDATES.filter(c => c.posting === o).sort((a, b) => stageRank(b.stage) - stageRank(a.stage));
    return { o, cands };
  }).sort((a, b) => a.cands.length - b.cands.length || (a.o.posted || "").localeCompare(b.o.posted || ""));
  const unmatched = CANDIDATES.filter(c => !c.posting);
  const possible = FLAGS.filter(f => (f.rule.id === "transfer" || f.rule.id === "retire") && f.status !== "resolved");
  main.innerHTML = hero("i-brief", "Hiring · positions to fill", "Openings", `${plural(OPENINGS.length, "posted opening")} · ${cards.filter(c => !c.cands.length).length} with no candidates · ${possible.length} possible from flags`) + `
    <div class="wrap content">
    <h2 class="sec">Posted openings</h2>
    <div class="ocards">${cards.map(({ o, cands }) => {
      const open = o.posted ? -daysUntil(dateOf(o.posted)) : null;
      const meta = [o.posted && "Posted " + fmtDate(o.posted), o.start && "Starts " + fmtDate(o.start), o.reason].filter(Boolean).join(" · ");
      return `<article class="ocard ${cands.length ? "" : "cold"}">
        <div class="ohead"><h2>${esc(o.position)}</h2>${open !== null ? `<span class="days">Open ${plural(open, "day")}</span>` : ""}</div>
        <p class="meta">${esc(meta || "Details not in files")}</p>
        ${cands.length ? `<ul class="clist">${cands.map(c => `<li><button data-id="${esc(c.id)}"><span class="cn"><span class="kdot" data-c="cand"></span>${esc(c.name)}<small>${esc(c.stage || "Stage not in files")}</small></span><span>${activeFlags(c).map(f => `<span class="flag">${ic(f.rule.icon)}${esc(f.rule.reason)}</span>`).join("")}</span></button></li>`).join("")}</ul>`
          : `<p class="nocand">No candidates yet.</p>`}
      </article>`;
    }).join("")}</div>
    ${possible.length ? `
      <div class="spaced"></div><h2 class="sec">Possible openings, from flags</h2>
      <div class="possible">${possible.map(f => `
        <button class="orow" data-id="${esc(f.person.id)}">
          <span class="rico">${ic(f.rule.icon)}</span>
          <span class="n">${esc(f.person.subject || "Subject not in files")}<small><span class="kdot" data-c="teach"></span>${esc(f.person.name)} · ${esc(f.why[0][0])}</small></span>
          <span class="reason">${esc(f.rule.reason)}</span>
        </button>`).join("")}</div>` : ""}
    ${unmatched.length ? `<div class="note"><b>Not matched to a posted opening:</b> ${unmatched.map(c => `<button class="linkish" data-id="${esc(c.id)}">${esc(c.name)}</button>`).join(", ")}. The opening on their application doesn't match any job posting.</div>` : ""}
    </div>`;
  bindPersonLinks(main);
}

/* ==================================================================
   PERSON PAGE
================================================================== */
function inputFor(p, f) {
  const id = "in-" + f.k;
  if (f.type === "choice") return `<select id="${id}" data-k="${f.k}"><option value="">Choose…</option>${f.options.map(o => `<option>${esc(o)}</option>`).join("")}</select>`;
  const ph = { text: "", int: "Number", month: "YYYY-MM", date: "YYYY-MM-DD", monthOrNone: "YYYY-MM, or none", dateOrNone: "YYYY-MM-DD, or none", textOrNone: "Name, or none" }[f.type] || "";
  return `<input id="${id}" data-k="${f.k}" placeholder="${ph}" ${f.type === "int" ? 'inputmode="numeric"' : ""}>`;
}

function renderPerson(id, keepScroll) {
  const p = PEOPLE.find(x => x.id === id);
  if (!p) return go("flags");
  const listView = p.kind === "teacher" ? "teachers" : "candidates";
  setNav(listView);
  const act = activeFlags(p);
  const badge = act.length
    ? `<span class="flag">${ic("i-flag")}${p.kind === "teacher" ? "Flagged: may leave" : "Flagged: check before offer"}</span>`
    : p.flags.length ? `<span class="clear done">All flags resolved</span>` : `<span class="clear">${p.missing.length ? "Missing information" : "No flags"}</span>`;
  const missFields = [...new Set(p.missing.flatMap(m => m.fields))].map(k => FIELD[p.kind][k]);
  const fileFields = FIELDS[p.kind].filter(f => f.k !== "name");
  const y = window.scrollY;
  const detailLine = p.kind === "teacher"
    ? [p.subject, p.dept, "Westfield High School"].filter(Boolean).join(" · ")
    : [p.opening ? "Applying for " + p.opening : null, p.stage, "Westfield High School"].filter(Boolean).join(" · ");
  main.innerHTML = `
    <div class="hero"><div class="wrap">
      <button class="back" id="back">← Back</button>
      <div class="herocard">
        <div class="av" aria-hidden="true">${esc(initials(p.name))}</div>
        <div class="who">
          <p class="eyebrow">${p.kind === "teacher" ? "Current teacher" : "Prospective hire"}</p>
          <h1>${esc(p.name)}</h1>
          <p class="subhead">${esc(detailLine)}</p>
        </div>
        <div class="pbadge">
          ${badge}
          ${p.kind === "candidate" && p.posting ? `<button class="linkish" id="toopen">See this opening</button>` : ""}
        </div>
      </div>
    </div></div>
    <div class="wrap content">
      <div class="pbody">
        ${p.flags.map(f => {
          const st = STATUS[f.key] || {};
          return `<section class="fblock ${f.status}" data-key="${esc(f.key)}">
            <div class="fhead">
              <div class="ftitle"><span class="rico ${f.status === "resolved" ? "done" : f.status === "progress" ? "prog" : ""}">${ic(f.rule.icon)}</span><div><p class="eyebrow">Why this flag</p><h2>${esc(f.rule.reason)}</h2></div></div>
              <div class="seg small" role="group" aria-label="Status of ${esc(f.rule.reason)}">
                ${["open", "progress", "resolved"].map(s => `<button data-s="${s}" aria-pressed="${f.status === s}">${STATUS_LABEL[s]}</button>`).join("")}
              </div>
            </div>
            <p class="when">Flagged when ${esc(f.rule.when)}</p>
            <ul class="why">${f.why.map(([fact, k]) => `<li><span>${esc(fact)}</span><span class="src ${p.src[k] ? "you" : ""}">${esc(srcOf(p, k))}</span></li>`).join("")}</ul>
            <div class="step"><p class="label">Possible next step</p><p>${esc(f.step)}</p></div>
            <div class="notes">
              <label for="note-${esc(f.key)}">Your notes</label>
              <textarea id="note-${esc(f.key)}" placeholder="What you've done or decided. Saved in this browser only.">${esc(st.note || "")}</textarea>
              <small class="saved">${st.at ? "Last updated " + esc(fmtDate(st.at)) : ""}</small>
            </div>
          </section>`;
        }).join("")}
        ${p.missing.length ? `
          <section class="ask" id="ask">
            <p class="label">Missing from the files</p>
            <p>${p.missing.length === 1 ? "This check was" : "These checks were"} not run: <b>${p.missing.map(m => esc(m.rule.reason)).join(", ")}</b>. The app won't guess. Add what you know below, or update the source records.</p>
            <div class="fields">${missFields.map(f => `<label for="in-${f.k}">${esc(f.label)}<small>${esc(f.src)}</small>${inputFor(p, f)}</label>`).join("")}</div>
            <button class="btn" id="savemiss">Save and re-check</button>
            <p class="err" id="misserr" role="alert"></p>
          </section>` : ""}
        ${!p.flags.length && !p.missing.length ? `<section class="fblock plain"><h2 class="sec">Checks</h2><p style="margin:0">All ${RULES[p.kind].length} checks ran. Nothing in this file matches a flag.</p></section>` : ""}
        <section>
          <h2 class="sec">What's in the file</h2>
          <dl class="file">${fileFields.map(f => {
            const v = show(f, p[f.k]);
            return `<div><dt>${esc(f.label)}</dt><dd class="${v === null ? "gone" : v === "None on file" ? "none" : ""}">${esc(v === null ? "Not in files" : v)}</dd><dd class="src ${p.src[f.k] ? "you" : ""}">${esc(srcOf(p, f.k))}</dd></div>`;
          }).join("")}</dl>
          ${Object.keys(p.src).length ? `<p style="margin-top:14px"><button class="linkish" id="undo">Remove what you entered for ${esc(p.name)}</button></p>` : ""}
        </section>
      </div>
    </div>`;

  document.getElementById("back").addEventListener("click", () => history.length > 1 ? history.back() : go(listView));
  const toOpen = document.getElementById("toopen");
  if (toOpen) toOpen.addEventListener("click", () => go("openings"));

  main.querySelectorAll(".fblock[data-key]").forEach(block => {
    const key = block.dataset.key;
    block.querySelectorAll("[data-s]").forEach(b => b.addEventListener("click", () => {
      STATUS[key] = Object.assign({}, STATUS[key], { s: b.dataset.s, at: isoToday() });
      save(KEY.status, STATUS); recompute(); renderPerson(id, true);
    }));
    const ta = block.querySelector("textarea"), saved = block.querySelector(".saved");
    ta.addEventListener("input", () => {
      STATUS[key] = Object.assign({ s: "open" }, STATUS[key], { note: ta.value, at: isoToday() });
      save(KEY.status, STATUS);
      saved.textContent = "Saved";
    });
  });

  const sm = document.getElementById("savemiss");
  if (sm) sm.addEventListener("click", () => {
    const errs = [], vals = {};
    missFields.forEach(f => {
      const el = document.getElementById("in-" + f.k);
      if (!el.value.trim()) return;
      const r = validate(f, el.value);
      if (r.error) errs.push(f.label + " " + r.error + ".");
      else vals[f.k] = r.value;
    });
    if (errs.length) { document.getElementById("misserr").textContent = errs.join(" "); return; }
    if (!Object.keys(vals).length) { document.getElementById("misserr").textContent = "Fill in at least one field."; return; }
    ENTERED[p.kind] = ENTERED[p.kind] || {};
    ENTERED[p.kind][p.id] = Object.assign({}, ENTERED[p.kind][p.id], vals);
    save(KEY.entered, ENTERED); recompute(); renderPerson(id, true);
  });
  const undo = document.getElementById("undo");
  if (undo) undo.addEventListener("click", () => {
    delete ENTERED[p.kind][p.id];
    save(KEY.entered, ENTERED); recompute(); renderPerson(id, true);
  });
  if (keepScroll) window.scrollTo(0, y);
}
const isoToday = () => TODAY.getFullYear() + "-" + pad2(TODAY.getMonth() + 1) + "-" + pad2(TODAY.getDate());

/* ==================================================================
   DISTRICT FILES (import / templates)
================================================================== */
function parseCSV(text) {
  text = text.replace(/^﻿/, "");
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

const csvCell = v => { const s = v == null ? "" : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function templateCSV(kind) {
  const fields = FIELDS[kind].filter(f => !f.derived);
  return "﻿" + [fields.map(f => f.csv), ...SAMPLE[kind]].map(r => r.map(csvCell).join(",")).join("\r\n");
}
function download(name, text) {
  const url = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function importFile(kind, text, fileName) {
  const rows = parseCSV(text);
  if (rows.length < 2) return { ok: false, msg: fileName + " has no rows to read." };
  const header = rows[0].map(h => h.trim().toLowerCase().replace(/\s+/g, "_"));
  const fields = FIELDS[kind].filter(f => !f.derived);
  const keyCol = kind === "opening" ? "position" : "name";
  if (!header.includes(keyCol)) return { ok: false, msg: fileName + " needs a “" + keyCol + "” column. Download the template to see the expected columns." };
  const colIdx = fields.map(f => header.indexOf(f.csv));
  const notFound = fields.filter((f, i) => colIdx[i] < 0).map(f => f.csv);
  const mapped = rows.slice(1).map(r => colIdx.map(i => i < 0 ? "" : r[i]));
  const { records, errors } = buildRecords(kind, mapped, 2);
  if (!records.length) return { ok: false, msg: fileName + " has no usable rows.", errors };
  DATA[kind] = records;
  DATA.source = "import";
  DATA.imported = Object.assign({}, DATA.imported, { [kind]: { file: fileName, at: isoToday() } });
  if (ENTERED[kind]) ENTERED[kind] = {};
  save(KEY.data, DATA); save(KEY.entered, ENTERED);
  const notes = errors.slice();
  if (notFound.length) notes.unshift("Columns not found, so treated as missing: " + notFound.join(", ") + ".");
  return { ok: true, msg: "Read " + plural(records.length, "row") + " from " + fileName + ".", errors: notes };
}

function renderFiles() {
  setNav("files");
  const FILES = [
    { kind: "teacher",   title: "Teachers",     icon: "i-users",     c: "teach", desc: "Personnel, pension, schedule, mentoring, HR, contract and license records, one row per teacher." },
    { kind: "candidate", title: "Candidates",   icon: "i-userplus",  c: "cand",  desc: "Applications and license lookups, one row per candidate." },
    { kind: "opening",   title: "Job postings", icon: "i-brief",     c: "open",  desc: "Open positions, one row per posting." }
  ];
  const n = ui.notice;
  main.innerHTML = hero("i-folder", "Setup · where the information comes from", "District files", DATA.source === "sample" ? "Using sample files. Every person in them is made up." : "Using your files. They stay in this browser on this computer and are never sent anywhere.") + `
    <div class="wrap content">
    <h2 class="sec">Your files</h2>
    ${FILES.map(f => {
      const imp = (DATA.imported || {})[f.kind];
      return `<div class="filerow">
        <div class="fico" data-c="${f.c}" style="--fs:var(--s-soft);--fi:var(--s-ink)">${ic(f.icon)}</div>
        <div><h2>${f.title}</h2><p>${f.desc}</p><p><b>${plural(DATA[f.kind].length, "row")}</b> · ${imp ? "from " + esc(imp.file) + ", " + esc(fmtDate(imp.at)) : "sample"}</p></div>
        <div class="acts">
          <input type="file" id="up-${f.kind}" accept=".csv,text/csv" data-kind="${f.kind}">
          <label class="btn" for="up-${f.kind}">Upload CSV</label>
          <button class="btn ghost" data-tpl="${f.kind}">Download template</button>
        </div>
      </div>`;
    }).join("")}
    ${n ? `<div class="result ${n.ok && !(n.errors || []).length ? "" : "warn"}" role="status"><b>${esc(n.msg)}</b>${(n.errors || []).length ? `<ul>${n.errors.slice(0, 8).map(e => `<li>${esc(e)}</li>`).join("")}${n.errors.length > 8 ? `<li>…and ${n.errors.length - 8} more.</li>` : ""}</ul>` : ""}</div>` : ""}
    <div class="howto">
      <div class="spaced"></div><h2 class="sec">How to prepare a file</h2>
      <ul>
        <li>Start from the template. It has the right columns and shows the sample rows as examples.</li>
        <li>Leave a cell blank when the information isn't in your records. The app will say so and ask, instead of guessing.</li>
        <li>Write <code>none</code> when the records say there isn't one, for example no mentor or no transfer request.</li>
        <li>Dates can be <code>2027-08-18</code> or <code>8/18/2027</code>. Months can be <code>2028-06</code> or <code>6/2028</code>.</li>
        <li>A candidate's <code>opening</code> should match a posting's <code>position</code> exactly, so they appear under that opening.</li>
      </ul>
      ${DATA.source !== "sample" ? `<p style="margin-top:20px"><button class="btn ghost" id="restore">Go back to the sample files</button></p>` : ""}
    </div>
    </div>`;
  ui.notice = null;
  main.querySelectorAll("[data-tpl]").forEach(b => b.addEventListener("click", () => download(b.dataset.tpl + "s-template.csv", templateCSV(b.dataset.tpl))));
  main.querySelectorAll("input[type=file]").forEach(inp => inp.addEventListener("change", () => {
    const file = inp.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { ui.notice = importFile(inp.dataset.kind, String(reader.result), file.name); recompute(); renderFiles(); };
    reader.onerror = () => { ui.notice = { ok: false, msg: "Couldn't read " + file.name + "." }; renderFiles(); };
    reader.readAsText(file);
  }));
  const r = document.getElementById("restore");
  if (r) r.addEventListener("click", () => {
    if (!confirm("Remove your imported files and anything you entered, and go back to the sample files?")) return;
    drop(KEY.data); drop(KEY.entered);
    DATA = sampleData(); ENTERED = { teacher: {}, candidate: {} };
    recompute(); ui.notice = { ok: true, msg: "Back to the sample files." }; renderFiles();
  });
}

/* ==================================================================
   ROUTING (so the browser Back button works)
================================================================== */
function go(route) { if (location.hash === "#/" + route) routeNow(); else location.hash = "#/" + route; }
function routeNow() {
  const h = location.hash.replace(/^#\//, "") || "flags";
  const [view, id] = h.split("/");
  if (view === "teachers") listPage("teacher");
  else if (view === "candidates") listPage("candidate");
  else if (view === "openings") renderOpenings();
  else if (view === "files") renderFiles();
  else if (view === "person") renderPerson(decodeURIComponent(id || ""));
  else renderFlags();
  main.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}
document.querySelectorAll(".nav").forEach(b => b.addEventListener("click", () => { ui.q = ""; ui.lf = ""; go(b.dataset.view); }));
window.addEventListener("hashchange", routeNow);
recompute();
routeNow();
</script>
